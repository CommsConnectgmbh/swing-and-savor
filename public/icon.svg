<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f12"/>
      <stop offset="50%" stop-color="#0a0f0a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aurora1)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aurora2)"/>

  <!-- Putting green ellipse -->
  <ellipse cx="256" cy="380" rx="180" ry="48" fill="url(#green)" opacity="0.85"/>
  <ellipse cx="256" cy="370" rx="180" ry="40" fill="#22c55e" opacity="0.18"/>

  <!-- Flag pole -->
  <rect x="248" y="120" width="10" height="240" rx="4" fill="url(#pole)"/>

  <!-- Flag (triangular pennant) -->
  <path d="M258 130 L 388 162 L 258 200 Z" fill="url(#flag)"/>
  <!-- Flag highlight -->
  <path d="M258 130 L 388 162 L 258 200 Z" fill="url(#shine)"/>

  <!-- Hole shadow -->
  <ellipse cx="256" cy="380" rx="22" ry="6" fill="#000" opacity="0.55"/>

  <!-- Golf ball with dimples -->
  <circle cx="200" cy="350" r="34" fill="url(#ball)"/>
  <g fill="#9ca3af" opacity="0.35">
    <circle cx="190" cy="340" r="2.2"/>
    <circle cx="206" cy="338" r="2.2"/>
    <circle cx="220" cy="346" r="2.2"/>
    <circle cx="186" cy="356" r="2.2"/>
    <circle cx="200" cy="360" r="2.2"/>
    <circle cx="216" cy="362" r="2.2"/>
    <circle cx="195" cy="370" r="2.2"/>
    <circle cx="210" cy="376" r="2.2"/>
  </g>
  <!-- Ball specular -->
  <circle cx="190" cy="338" r="9" fill="#ffffff" opacity="0.75"/>

  <!-- Top specular highlight (Apple-Glass shine) -->
  <rect x="0" y="0" width="512" height="220" rx="112" fill="url(#shine)"/>
</svg>
