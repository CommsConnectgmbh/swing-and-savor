    <!-- Farb-Theme vor dem ersten Paint setzen (verhindert Aufblitzen).
         Standard ist hell; eine gespeicherte Wahl gewinnt. Muss mit
         src/lib/theme.js übereinstimmen. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sw_theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0A1A12' : '#EFEBE1');
        } catch (e) {}
      })();
    </script>
