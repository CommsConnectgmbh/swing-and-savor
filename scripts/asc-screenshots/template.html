<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Swing & Savor Screenshot</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #0d271e;
    --bg-soft: #1f3f2c;
    --ink: #ffffff;
    --ink-soft: #d1d5db;
    --muted: #9ca3af;
    --brand: #98cd02;
    --brand-dark: #6b9300;
    --surface: #ffffff;
    --surface-ink: #0a1f15;
    --border: rgba(255,255,255,0.10);
    --border-light: #e5e7eb;
    --success: #16a34a;
    --warn: #f59e0b;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: var(--w);
    height: var(--h);
    display: flex;
    flex-direction: column;
    padding: var(--pad-top) var(--pad-x) var(--pad-bot);
    background:
      radial-gradient(80% 60% at 20% 0%, rgba(152,205,2,0.12) 0%, transparent 60%),
      linear-gradient(180deg, #0d271e 0%, #1f3f2c 60%, #0d271e 100%);
    position: relative;
    overflow: hidden;
  }

  .headline {
    font-size: var(--head-size);
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-weight: 800;
    color: var(--ink);
  }
  .headline em {
    font-style: normal;
    color: var(--brand);
  }
  .sub {
    font-size: var(--sub-size);
    color: var(--ink-soft);
    margin-top: var(--gap);
    line-height: 1.35;
    max-width: 92%;
  }

  .phone-frame {
    flex: 1 1 auto;
    margin-top: var(--frame-gap);
    background: #000;
    border-radius: var(--frame-radius);
    padding: calc(var(--frame-radius) * 0.06);
    box-shadow:
      0 30px 80px -10px rgba(152, 205, 2, 0.20),
      0 12px 40px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .phone-screen {
    flex: 1;
    background: #f7faf6;
    color: var(--surface-ink);
    border-radius: calc(var(--frame-radius) * 0.85);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Status bar */
  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--status-pad) var(--inner-pad);
    font-size: var(--status-size);
    font-weight: 600;
    color: var(--surface-ink);
  }
  .status-dots { display: flex; gap: 6px; align-items: center; }
  .status-dots span { font-size: calc(var(--status-size) * 0.85); }

  /* App content */
  .app {
    flex: 1;
    padding: var(--inner-pad);
    display: flex;
    flex-direction: column;
    gap: var(--inner-gap);
    overflow: hidden;
  }
  .app-title {
    font-size: var(--app-title);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--surface-ink);
  }
  .app-sub {
    font-size: var(--app-sub);
    color: var(--muted);
    margin-top: -8px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--card-radius);
    padding: var(--card-pad);
    display: flex;
    flex-direction: column;
    gap: var(--card-gap);
    box-shadow: 0 2px 4px rgba(13, 39, 30, 0.06);
  }
  .card-brand {
    background: linear-gradient(135deg, #0d271e 0%, #1f3f2c 100%);
    color: white;
    border: 0;
  }
  .card-label {
    font-size: var(--label-size);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 700;
  }
  .card-brand .card-label { color: rgba(255,255,255,0.65); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(152, 205, 2, 0.18);
    color: var(--brand-dark);
    padding: var(--pill-pad-y) var(--pill-pad-x);
    border-radius: 9999px;
    font-size: var(--pill-text);
    font-weight: 700;
    width: fit-content;
  }
  .pill.live {
    background: #fff1f1;
    color: #dc2626;
  }
  .pill.live::before {
    content: '';
    width: 12px; height: 12px; border-radius: 50%;
    background: #dc2626;
  }

  /* Tournament row */
  .tour-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--inner-gap);
  }
  .tour-meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tour-name {
    font-weight: 800;
    font-size: var(--btn-text);
    color: var(--surface-ink);
    letter-spacing: -0.01em;
  }
  .tour-info {
    font-size: var(--app-sub);
    color: var(--muted);
  }
  .tour-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .tour-score {
    font-weight: 800;
    font-size: var(--meta-v-size);
    color: var(--brand-dark);
  }

  /* Hole scoring grid */
  .holes {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
  }
  .hole {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    padding: 8px 0;
    border-radius: 10px;
    background: #f5f7f3;
  }
  .hole-n { font-size: calc(var(--label-size) * 0.95); color: var(--muted); font-weight: 700; }
  .hole-s {
    font-size: var(--btn-text);
    font-weight: 800;
    color: var(--surface-ink);
  }
  .hole.birdie { background: #ecfccb; color: var(--brand-dark); }
  .hole.birdie .hole-s { color: var(--brand-dark); }
  .hole.eagle { background: #d9f99d; }
  .hole.bogey { background: #fef3c7; }
  .hole.bogey .hole-s { color: #b45309; }
  .hole.par .hole-s { color: var(--surface-ink); }

  /* Match score block */
  .match-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 18px;
  }
  .player {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .avatar {
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    background: linear-gradient(135deg, #98cd02 0%, #6b9300 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: calc(var(--avatar) * 0.40);
  }
  .player-name {
    font-weight: 700;
    font-size: var(--btn-text);
    color: var(--surface-ink);
  }
  .player-hcp {
    font-size: var(--app-sub);
    color: var(--muted);
  }
  .vs {
    font-size: var(--meta-v-size);
    font-weight: 900;
    color: var(--muted);
    letter-spacing: -0.02em;
  }

  /* CTA */
  .cta {
    background: var(--brand);
    color: var(--surface-ink);
    border-radius: var(--card-radius);
    padding: var(--cta-pad);
    text-align: center;
    font-weight: 800;
    font-size: var(--cta-text);
    letter-spacing: -0.01em;
    box-shadow: 0 8px 20px rgba(152, 205, 2, 0.40);
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--meta-gap);
  }
  .meta { display: flex; flex-direction: column; gap: 4px; }
  .meta-l { font-size: var(--label-size); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .meta-v { font-size: var(--meta-v-size); font-weight: 800; color: var(--surface-ink); }
  .meta-v.brand { color: var(--brand-dark); }

  /* Bottom nav */
  .bnav {
    display: flex;
    justify-content: space-around;
    padding: var(--inner-pad) var(--inner-pad) calc(var(--inner-pad) * 0.7);
    border-top: 1px solid var(--border-light);
    background: white;
  }
  .bnav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted);
    font-size: calc(var(--label-size) * 1.05);
    font-weight: 600;
  }
  .bnav-item.active { color: var(--brand-dark); }
  .bnav-ico { font-size: calc(var(--btn-text) * 0.95); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
  const params = new URLSearchParams(location.search);
  const device = params.get("device") || "iphone69";

  const G = {

    '--head-size': G.headSize, '--sub-size': G.subSize, '--gap': G.gap,
    '--frame-gap': G.frameGap, '--frame-radius': G.frameRadius,
    '--status-pad': G.statusPad, '--status-size': G.statusSize,
    '--inner-pad': G.innerPad, '--inner-gap': G.innerGap,
    '--app-title': G.appTitle, '--app-sub': G.appSub,
    '--card-radius': G.cardRadius, '--card-pad': G.cardPad, '--card-gap': G.cardGap,

  const stage = document.getElementById("stage");

              <div class="tour-side">

            </div>
          </div>

        </div>

    "3": {

      sub: "Heimatclub setzen, Plätze in der Nähe finden — von Bad Wiessee bis Belek. Community pflegt Pars und Handicaps.",

  stage.innerHTML = `
    <div class="headline">${s.headline}</div>
    <div class="sub">${s.sub}</div>
    <div class="phone-frame">
      <div class="phone-screen">${s.screen}</div>

  `;
</script>
</body>
</html>
