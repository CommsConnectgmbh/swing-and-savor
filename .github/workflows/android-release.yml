name: Android · Release AAB + Play Internal

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "AAB nach Build zu Google Play Internal-Track hochladen"
        type: boolean
        default: true
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install native deps
        run: npm ci --no-audit --no-fund

      - name: Build web bundle (root)
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Sync web bundle into native/www
        working-directory: .
        run: |
          rm -rf native/www
          cp -R dist native/www
          ls native/www | head -10

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.SWINGSAVOR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SWINGSAVOR_KEYSTORE_BASE64 missing — run 'Android · Keystore bootstrap' first, then paste secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          ls -la android/upload-keystore.jks

      - name: Build signed release AAB
        env:
          SWINGSAVOR_KEYSTORE_PATH:     ${{ github.workspace }}/native/android/upload-keystore.jks
          SWINGSAVOR_KEYSTORE_PASSWORD: ${{ secrets.SWINGSAVOR_KEYSTORE_PASSWORD }}
          SWINGSAVOR_KEY_ALIAS:         ${{ secrets.SWINGSAVOR_KEY_ALIAS }}
          SWINGSAVOR_KEY_PASSWORD:      ${{ secrets.SWINGSAVOR_KEY_PASSWORD }}
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build signed release APK (sideload-friendly)
        env:
          SWINGSAVOR_KEYSTORE_PATH:     ${{ github.workspace }}/native/android/upload-keystore.jks
          SWINGSAVOR_KEYSTORE_PASSWORD: ${{ secrets.SWINGSAVOR_KEYSTORE_PASSWORD }}
          SWINGSAVOR_KEY_ALIAS:         ${{ secrets.SWINGSAVOR_KEY_ALIAS }}
          SWINGSAVOR_KEY_PASSWORD:      ${{ secrets.SWINGSAVOR_KEY_PASSWORD }}
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName' android/app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode' android/app/build.gradle | head -1 | awk '{print $2}')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: swingsavor-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swingsavor-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check Play Service-Account secret
        id: play_sa
        if: ${{ github.event_name == 'push' || inputs.upload_to_play }}
        env:
          SA_JSON: ${{ secrets.SWINGSAVOR_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SWINGSAVOR_PLAY_SERVICE_ACCOUNT_JSON nicht gesetzt — Play-Upload wird übersprungen. Setup: native/PLAY_AUTO_UPLOAD_SETUP.md"
          fi

      - name: Upload AAB to Google Play (Internal Track)
        if: steps.play_sa.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SWINGSAVOR_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.commsconnect.swingandsavor
          releaseFiles: native/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          changesNotSentForReview: false
