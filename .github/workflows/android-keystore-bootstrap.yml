name: Android · Keystore bootstrap (one-shot)

# Generates the upload keystore once. Output is base64 + plaintext password
# printed to the job artifact — paste into the repo secrets listed below,
# then never run this workflow again.
#
# Required secrets after this runs:
#   SWINGSAVOR_KEYSTORE_BASE64   — base64 contents of upload-keystore.jks
#   SWINGSAVOR_KEYSTORE_PASSWORD — store password
#   SWINGSAVOR_KEY_ALIAS         — "swingsavor-upload"
#   SWINGSAVOR_KEY_PASSWORD      — key password (= store password here)

on:
  workflow_dispatch:
    inputs:
      cn:
        description: 'Certificate Common Name'
        required: true
        default: 'Comms Connect GmbH'
      org:
        description: 'Organization (O)'
        required: true
        default: 'Comms Connect GmbH'
      country:
        description: 'Country code (C)'
        required: true
        default: 'DE'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate random password
        id: pw
        run: |
          PASSWORD="$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)"
          echo "::add-mask::$PASSWORD"
          echo "value=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Generate upload keystore
        env:
          KS_PASS: ${{ steps.pw.outputs.value }}
        run: |
          keytool -genkeypair \
            -alias swingsavor-upload \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keystore upload-keystore.jks \
            -storetype PKCS12 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=${{ inputs.cn }}, O=${{ inputs.org }}, C=${{ inputs.country }}"

      - name: Encode keystore + write password file
        env:
          KS_PASS: ${{ steps.pw.outputs.value }}
        run: |
          base64 -w0 upload-keystore.jks > upload-keystore.b64
          {
            printf 'SWINGSAVOR_KEYSTORE_PASSWORD=%s\n' "$KS_PASS"
            printf 'SWINGSAVOR_KEY_ALIAS=%s\n' 'swingsavor-upload'
            printf 'SWINGSAVOR_KEY_PASSWORD=%s\n' "$KS_PASS"
          } > secrets.env

      - name: Write to job summary
        run: |
          {
            echo "## Android upload keystore generated"
            echo ""
            echo "Download the artifact \`swingsavor-upload-keystore\` — it contains:"
            echo "- \`upload-keystore.jks\` — the actual keystore (back up offline!)"
            echo "- \`upload-keystore.b64\` — base64-encoded version (paste into \`SWINGSAVOR_KEYSTORE_BASE64\` secret)"
            echo "- \`secrets.env\` — the three password/alias secrets"
            echo ""
            echo "WARNING: lose this keystore = you can never publish updates to the existing Play listing. Back it up offline."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swingsavor-upload-keystore
          path: |
            upload-keystore.jks
            upload-keystore.b64
            secrets.env
          retention-days: 1
          if-no-files-found: error
